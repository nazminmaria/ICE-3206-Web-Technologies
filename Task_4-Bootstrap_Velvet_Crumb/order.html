<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order - Velvet Crumb</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container">
    <a class="navbar-brand" href="index.html">Velvet Crumb</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="menu.html">Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="gallery.html">Gallery</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contact</a>
        </li>
        <li class="nav-item">
  <a class="nav-link active btn-order" href="order.html">Order Now</a>
</li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1>Place Your Order</h1>
      <p>Select your favourite treat and provide your details.</p>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow-sm border-0 p-4">

          <form>
            <div class="mb-3">
              <label class="form-label">Select Item</label>
              <select class="form-select">
                <option selected>Choose an item</option>
                <option>Classic Chocolate Cake</option>
                <option>Black Gold Cake</option>
                <option>Floral Cake</option>
                <option>Golden Celebration Cake</option>
                <option>Luxury Cake</option>
                <option>Chocolate Celebration Cake</option>
                <option>Strawberry Cream Donut</option>
                <option>Blueberry Cream Roll</option>
                <option>Brownie with Ice Cream</option>
                <option>Tiramisu</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" min="1" value="1">
            </div>

            <div class="mb-3">
              <label class="form-label">Your Name</label>
              <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="tel" class="form-control" placeholder="Enter your phone number">
            </div>

            <div class="mb-3">
              <label class="form-label">Delivery Address</label>
              <textarea class="form-control" rows="3" placeholder="Enter your delivery address"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Special Instructions</label>
              <textarea class="form-control" rows="2" placeholder="Any special request?"></textarea>
            </div>

            <button type="submit" class="btn btn-order w-100">
              Place Order
            </button>
          </form>

        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
